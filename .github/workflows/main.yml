name: Sync Assignment Tracker to Google Sheets

on:
  schedule:
    # Every 3 hours, at :30 UTC = 02:00, 05:00, 08:00, 11:00, 14:00, 17:00, 20:00, 23:00 IST.
    # GitHub may start scheduled runs a few minutes late.
    - cron: "30 */3 * * *"
  workflow_dispatch: {}   # "Run workflow" button for manual runs

concurrency:
  group: assignment-tracker-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Sync Metabase questions to Sheets
        env:
          METABASE_API_KEY: ${{ secrets.METABASE_API_KEY }}
          GCP_SA_JSON: ${{ secrets.GCP_SA_JSON }}
        run: python sync_metabase_to_sheets.py
